mple past: regular -ed, irregular forms; comparative -er/more, superlative -est/most.", "intro": "", "qs": [["1. Yesterday I ___ (go) to town.", ["went"]], ["2. She ___ (buy) a shirt.", ["bought"]], ["3. We ___ (play) football.", ["played"]], ["4. This bag is ___ (cheap) than that one.", ["cheaper"]], ["5. This is the ___ (expensive) shirt.", ["most expensive"]], ["6. Tom is ___ (good) at football than me.", ["better"]], ["7. Mia is the ___ (good) player.", ["best"]], ["8. He ___ (see) a film yesterday.", ["saw"]], ["9. My room is ___ (big) than yours.", ["bigger"]], ["10. This is the ___ (small) dog.", ["smallest"]], ["11. They ___ (visit) us last week.", ["visited"]], ["12. This book is ___ (interesting) than that one.", ["more interesting"]]]}, {"date": "10.12.", "title": "Puffer / Mediation", "rule": "Vermittle die wichtigsten Informationen sinngemäß, nicht Wort für Wort.", "intro": "", "qs": [["Neuer Stoff hat Vorrang. Sonst Mediation: Erkläre einem englischen Freund die Jugendclubregeln: Eintritt frei, Getränke erlaubt, kein Essen im Musikraum, Schluss um 20 Uhr.", []], ["Antwort 1", []], ["Antwort 2", []], ["Antwort 3", []], ["Antwort 4", []]]}, {"date": "11.12.", "title": "Puffer / Wiederholung", "rule": "Falls neuer Stoff da ist, hat er Vorrang.", "intro": "", "qs": [["1. He ___ tidy his room (Pflicht, have to).", ["has to"]], ["2. You ___ swim here (Verbot, must).", ["mustn't", "must not"]], ["3. We ___ pay (keine Pflicht).", ["don't have to", "do not have to"]], ["4. She ___ watch TV (Erlaubnis).", ["is allowed to"]], ["5. Ben and Mia help ___ (einander).", ["each other"]], ["6. They look at ___ in their own mirrors.", ["themselves"]], ["7. We send ___ messages (einander).", ["each other"]], ["8. I am proud of ___.", ["myself"]], ["9. Yesterday I ___ (go) to town.", ["went"]], ["10. She ___ (buy) a shirt.", ["bought"]], ["11. We ___ (play) football.", ["played"]], ["12. This bag is ___ (cheap) than that one.", ["cheaper"]]]}, {"date": "12.12.", "title": " dayIndex>=0)i=todayIndex;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('sunnyEnglish2026v2',JSON.stringify(state))}catch(e){$('status').textContent='Speichern ist in diesem Browser nicht verfügbar.'}update()}function get(){return state[i]??=( {a:{},v:false,done:false})}function norm(s){return s.toLowerCase().trim().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?]$/,'')}function correct(q,a){return q[1].some(k=>norm(k)===norm(a||''))}function update(){let done=0,points=0;days.forEach((d,j)=>{let s=state[j];if(!s)return;points+=d.qs.filter((q,k)=>q[1].length&&correct(q,s.a[k])).length;if(s.done){if(j>0)done++;points+=3}if(s.v&&j>0&&j<=14)points+=5});$('score').textContent=points+' Sterne · '+done+' von 18 Tagen';$('stars').textContent='★'.repeat(Math.min(5,Math.floor(done/3)))+'☆'.repeat(5-Math.min(5,Math.floor(done/3)));$('progress').value=done;$('trophy').textContent=done>=18?'🏆 English Champion!':done>=14?'🥇 Gold':done>=9?'🥈 Silber':done>=4?'🥉 Bronze':'Sammle deine ersten Sterne!';$('status').textContent=get().done?'✅ Lerntag abgeschlossen':(i===0?'8 Minuten – nur zum Testen!':'15 Minuten – du schaffst das!');Array.from($('day').options).forEach((o,j)=>o.textContent=days[j].date+' '+days[j].title+(state[j]?.done?' ✓':''))}function el(tag,text,parent){let x=document.createElement(tag);if(text)x.textContent=text;parent.append(x);return x}function render(){let d=days[i],s=get(),root=$('lesson');root.replaceChildren();let head=el('section','',root);el('h2',d.date+' – '+d.title,head);el('p','💡 '+d.rule,head);if(d.intro)el('p',d.intro,head);el('small','Schreibe die fehlenden Wörter. Bei freien Aufgaben gibt es keine automatische Bewertung.',head);d.qs.forEach((q,k)=>{let box=el('div','',root);box.className='question';el('strong',q[0].replace(/___/g,'_____'),box);if(!q[1].length&&!/^Antwort/.test(q[0]))return;let input=el(q[1].length?'input':'textarea','',box);if(q[1].length)input.type='text';input.placeholder='Deine Antwort';input.value=s.a[k]||'';input.setAttribute('aria-label',q[0]);let msg=el('p','',box);function check(){if(!input.value.trim()){msg.textContent='';return}let ok=correct(q,input.value);msg.className=ok?'good':'bad';msg.textContent=ok?'⭐ Super, richtig!':'Noch nicht ganz – versuch es erneut.'}input.oninput=()=>{s.a[k]=input.value;save();if(q[1].length)check()};if(q[1].length){check();let b=el('button','Lösung anzeigen',box);b.className='secondary';b.onclick=()=>{msg.textContent='Lösung: '+q[1].join(' / ');msg.className=''}}});let end=el('section','',root);if(i>0&&i<=14){let l=el('label','',end),c=el('input','',l);c.type='checkbox';c.checked=s.v;c.onchange=()=>{s.v=c.checked;save()};l.append(' 📚 Vokabelpäckchen '+i+' gelernt (+5 Sterne)')}else if(i>14)el('p','📚 Schwierige Vokabeln wiederholen.',end);else el('p','🎁 Heute kein zusätzliches Vokabeltraining in der App.',end);let l=el('label','',end),c=el('input','',l);c.type='checkbox';c.checked=s.done;c.onchange=()=>{s.done=c.checked;save()};l.append(i===0?' 🎉 8 Minuten ausprobiert und Antworten kontrolliert (+3 Bonussterne)':' 🎉 15 Minuten gelernt und Antworten kontrolliert (+3 Sterne)');update()}function move(n){i=Math.max(0,Math.min(days.length-1,i+n));$('day').value=i;render();window.scrollTo(0,0)}function report(){return '☀️ Sunny’s English Challenge\n'+$('score').textContent+'\n'+days.map((d,j)=>{let s=state[j];if(!s||(!s.done&&!s.v&&!Object.values(s.a).some(a=>a.trim())))return '';let qs=d.qs.filter(q=>q[1].length),ok=d.qs.filter((q,k)=>q[1].length&&correct(q,s.a[k])).length;let errors=d.qs.map((q,k)=>q[1].length&&s.a[k]?.trim()&&!correct(q,s.a[k])?q[0]+' → '+s.a[k]:null).filter(Boolean);return d.date+' '+d.title+': '+ok+'/'+qs.length+' richtig '+(s.done?'✅':'⏳')+(j>0&&j<=14?' | Vokabeln '+(s.v?'✅':'⬜'):'')+(errors.length?'\nNoch üben: '+errors.join('; '):'')}).filter(Boolean).join('\n')}function exportProgress(){let t=report();window.location.href='https://wa.me/?text='+encodeURIComponent(t)}function copyReport(){let t=report();$('copy').textContent=t;$('copy').style.whiteSpace='pre-wrap';if(navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>{});}days.forEach((d,j)=>{let o=el('option',d.date,$('day'));o.value=j});$('day').onchange=e=>{i=+e.target.value;render()};$('day').value=i;render();</script></html>
